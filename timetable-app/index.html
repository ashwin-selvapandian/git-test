<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Timetable</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3d6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timetable">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle">Ashwin's Timetable</h1>
    <div class="topbar-actions" id="scheduleActions">
      <button id="addEventBtn" class="btn primary">+ Add Class</button>
      <button id="exportBtn" class="btn">Export</button>
      <button id="importBtn" class="btn">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <main>
    <section id="viewSchedule" class="view">
      <div id="conflictBanner" class="conflict-banner hidden"></div>

      <div class="dashboard-layout">
        <div class="calendar-wrapper">
          <div class="calendar-grid" id="calendarGrid">
            <!-- generated by JS -->
          </div>
        </div>

        <aside class="deadlines">
          <h2>Upcoming</h2>
          <ol class="deadlines-list" id="deadlinesList">
            <!-- generated by JS -->
          </ol>
        </aside>
      </div>
    </section>

    <section id="viewTodo" class="view hidden">
      <div class="panel-card">
        <form id="todoForm" class="inline-form">
          <input type="text" id="todoInput" placeholder="Add a task…" required>
          <button type="submit" class="btn primary">Add</button>
        </form>
        <ul class="todo-list" id="todoList">
          <!-- generated by JS -->
        </ul>
      </div>
    </section>

    <section id="viewNotes" class="view hidden">
      <div class="panel-card">
        <div class="panel-toolbar">
          <button id="addNoteBtn" class="btn primary">+ New Note</button>
        </div>
        <div class="notes-grid" id="notesGrid">
          <!-- generated by JS -->
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="schedule">
      <span class="tab-icon" aria-hidden="true">🗓</span>
      <span class="tab-label">Schedule</span>
    </button>
    <button class="tab" data-view="todo">
      <span class="tab-icon" aria-hidden="true">✓</span>
      <span class="tab-label">To-Do</span>
    </button>
    <button class="tab" data-view="notes">
      <span class="tab-icon" aria-hidden="true">✎</span>
      <span class="tab-label">Notes</span>
    </button>
  </nav>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modalTitle">Add Class</h2>
      <form id="eventForm">
        <input type="hidden" id="eventId">

        <label>Title
          <input type="text" id="eventTitle" required placeholder="e.g. Calculus 101">
        </label>

        <label>Day
          <select id="eventDay" required>
            <option value="0">Monday</option>
            <option value="1">Tuesday</option>
            <option value="2">Wednesday</option>
            <option value="3">Thursday</option>
            <option value="4">Friday</option>
            <option value="5">Saturday</option>
            <option value="6">Sunday</option>
          </select>
        </label>

        <div class="row">
          <label>Start
            <input type="time" id="eventStart" required>
          </label>
          <label>End
            <input type="time" id="eventEnd" required>
          </label>
        </div>

        <label>Location
          <input type="text" id="eventLocation" placeholder="e.g. Room 204 (optional)">
        </label>

        <label>Color
          <input type="color" id="eventColor" value="#3d6b5c">
        </label>

        <p class="error hidden" id="formError"></p>

        <div class="modal-actions">
          <button type="button" id="deleteBtn" class="btn danger hidden">Delete</button>
          <button type="button" id="cancelBtn" class="btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
